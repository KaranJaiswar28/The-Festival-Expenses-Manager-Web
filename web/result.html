<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b0c02"><title>Receipt | Festival Expense Manager</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="donate"><div id="nav"></div>
<main><section class="glass card narrow" id="box"></section></main>
<script src="js/config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/app.js"></script>
<script src="js/cloud.js"></script>
<script>
if(window.Cloud)Cloud.syncPending();
const d=Store.cur();
if(!d||d.status==='Pending'){location.replace(d?'payment.html':'index.html')}else{
const M={Success:['PAID','#ff9800','#e65100','Thank you for your generous contribution.'],
Failed:['FAILED','#f44336','#b71c1c',d.reason||'Your payment could not be completed. You can try again.'],
Cancelled:['CANCELLED','#78909c','#455a64','No payment has been completed.']}[d.status];
const box=document.getElementById('box');
box.innerHTML=`${stepper(3)}${Ticket.html({org:Cfg().event,kind:d.status==='Success'?'DONATION RECEIPT':'PAYMENT '+d.status.toUpperCase(),number:d.id,amount:d.amount,badge:M[0]+' · '+String(d.method).toUpperCase(),c1:M[1],c2:M[2],
 rows:[['Donor',d.name],['Mobile',d.mobile],['Date',when(d.paidAt||d.createdAt)],['Paid with',d.instrument||d.method],['Transaction ID',d.txn],['Bank reference',d.rrn],['Message',d.remarks]],foot:M[3]})}
<div style="margin-top:18px">${d.status==='Success'?`<button class="btn pri" onclick="print()">${icon('print')}Print receipt</button><a class="btn sec" href="index.html">${icon('heart')}Donate again</a>`
:`<a class="btn pri" href="payment.html">${icon('refresh')}${d.status==='Failed'?'Try again':'Return to payment'}</a>`}
${Auth.me()?`<a class="btn ghost" href="donations.html">${icon('list')}View all donations</a>`:''}</div>`;
Ticket.fit(box);addEventListener('load',()=>Ticket.fit(box));addEventListener('resize',()=>Ticket.fit(box));
}
</script></body></html>
