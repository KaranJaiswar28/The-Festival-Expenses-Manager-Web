<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#140f3a"><title>Home | Festival Expense Manager</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="home"><div id="nav"></div>
<main id="m"></main>
<script src="js/app.js"></script>
<script>
const me=Auth.require('home');
if(me){
const c=Cfg(),ds=Store.all().filter(d=>d.status==='Success'),ex=Exp.all(),col=ds.reduce((a,d)=>a+d.amount,0),sp=ex.reduce((a,e)=>a+e.amount,0),bal=col-sp;
const staff=ACCESS.donations.includes(me.role);
document.getElementById('m').innerHTML=`<h1>Welcome, ${esc(me.name.split(' ')[0])}</h1><p class="sub">${esc(me.role)} · ${esc(c.event)}</p>
<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
<div class="glass stat"><small>Collected</small><b style="color:var(--gold)">${inr(col)}</b></div>
<div class="glass stat"><small>Spent</small><b>${inr(sp)}</b></div>
<div class="glass stat"><small>Balance</small><b style="color:${bal<0?'var(--bad)':'var(--ok)'}">${inr(bal)}</b></div>
<div class="glass stat"><small>Donors</small><b>${new Set(ds.map(d=>d.mobile)).size}</b></div></div>
<div class="glass card"><h2>Quick actions</h2><div class="qa"><a class="btn pri" href="index.html">${icon('heart')}New donation</a>
<a class="btn sec" href="donations.html">${icon('list')}All donations</a><a class="btn sec" href="expenses.html">${icon(can('addExpense')?'plus':'wallet')}${can('addExpense')?'Add expense':'View expenses'}</a>
<a class="btn sec" href="qr.html">${icon('qr')}QR code</a><a class="btn sec" href="profile.html">${icon('edit')}Edit profile</a>
${ACCESS.settings.includes(me.role)?`<a class="btn sec" href="settings.html">${icon('gear')}Settings</a>`:''}</div></div>
${true?`<div class="cols"><div class="glass card"><h2>Recent donations</h2>${ds.slice(0,5).map(d=>`<div class="mini"><div><b>${esc(d.name)}</b><small>${when(d.paidAt)}</small></div><b>${inr(d.amount)}</b></div>`).join('')||'<p class="sub">No successful donations yet.</p>'}</div>
<div class="glass card"><h2>Recent expenses</h2>${ex.slice(0,5).map(e=>`<div class="mini"><div><b>${esc(e.title)}</b><small>${esc(e.cat)} · ${esc(e.date)}</small></div><b>${inr(e.amount)}</b></div>`).join('')||'<p class="sub">No expenses recorded yet.</p>'}</div></div>`:''}`;
}
</script></body></html>
